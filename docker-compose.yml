name: personal-search

services:
  qdrant:
    image: ${QDRANT_IMAGE:-qdrant/qdrant:v1.19.2}
    ports:
      - "127.0.0.1:6333:6333"
      - "127.0.0.1:6334:6334"
    volumes:
      - qdrant_data:/qdrant/storage

volumes:
  qdrant_data:
    name: ${QDRANT_VOLUME_NAME:-personal-search-qdrant-data}
    external: true
